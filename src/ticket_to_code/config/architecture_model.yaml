# CC4E Architecture Model — Domain Ownership Definitions
# 
# PROJECT-SPECIFIC CONFIGURATION for the CC4E codebase.
# Other projects should create their own architecture_model.yaml.
# See: config/architecture_model.template.yaml for a blank template.
#
# This file defines the bounded contexts, capabilities, and ownership
# rules for the CC4E microservice architecture. It is the single source
# of truth for the Domain Ownership layer.
#
# Provenance levels:
#   DECLARATIVE  — Developer-maintained, high confidence → hard blocks
#   DISCOVERED   — Auto-discovered from repo structure → soft warnings
#   LLM_INFERRED — Inferred by LLM → soft warnings, needs verification
#   VERIFIED     — Was discovered/inferred, then confirmed → hard blocks
#
# Modification policies derived from verdicts:
#   PRIMARY_OWNER          → ALLOW
#   SECONDARY_PARTICIPANT  → ALLOW_WITH_EVIDENCE
#   REFERENCE_ONLY         → REFERENCE_ONLY (read but don't modify)
#   WRONG_DOMAIN           → DO_NOT_MODIFY (hard block)
#   UNKNOWN                → REQUIRE_VERIFICATION (investigate)

services:
  # ── project-service ─────────────────────────────────────────────────
  - name: project-service
    path_prefix: project-service/
    domain: "Project CRUD, lifecycle, project membership, project settings"
    capabilities:
      - name: project-membership
        keywords:
          - member
          - membership
          - project member
          - add member
          - existing member
          - organization name
          - org name
          - member check
          - project membership
        primary_owners: [project-service]
        secondary_participants: [issues-service]
        reference_only: [area-service, xchange-ui]
        provenance: DECLARATIVE
        confidence: 1.0

      - name: project-crud
        keywords:
          - create project
          - delete project
          - project settings
          - project lifecycle
          - project initialization
        primary_owners: [project-service]
        secondary_participants: [sagas-service]
        reference_only: []
        provenance: DECLARATIVE
        confidence: 1.0

  # ── area-service ────────────────────────────────────────────────────
